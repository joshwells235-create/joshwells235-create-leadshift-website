<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video placeholder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Instrument Sans';src:url(/_blob/aca59b927bec6d2365f36d9047a8ca34) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Raleway';src:url(/_blob/9a291c3f4c3e1914f777a6127710ab54) format('woff2');font-weight:100 900;font-display:swap}
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="{{label}}" style="position: relative; box-sizing: border-box; width: 100%; aspect-ratio: 16 / 9; min-height: 260px; overflow: hidden; border-radius: 16px; padding: clamp(28px, 3.4vw, 40px); display: flex; flex-direction: column; justify-content: space-between; gap: 24px; background: radial-gradient(ellipse 75% 85% at 82% 0%, rgba(0, 126, 250, 0.34), rgba(0, 126, 250, 0.07) 55%, rgba(0, 126, 250, 0) 78%), #0A1238; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 32px 64px -34px rgba(5, 10, 40, 0.6); font-family: 'Raleway', Arial, sans-serif; color: rgba(255, 255, 255, 0.74)">
  <span aria-hidden="true" style="position: absolute; top: 14px; left: 14px; width: 18px; height: 18px; border-top: 1.5px solid rgba(255, 255, 255, 0.36); border-left: 1.5px solid rgba(255, 255, 255, 0.36)"></span>
  <span aria-hidden="true" style="position: absolute; top: 14px; right: 14px; width: 18px; height: 18px; border-top: 1.5px solid rgba(255, 255, 255, 0.36); border-right: 1.5px solid rgba(255, 255, 255, 0.36)"></span>
  <span aria-hidden="true" style="position: absolute; bottom: 14px; left: 14px; width: 18px; height: 18px; border-bottom: 1.5px solid rgba(255, 255, 255, 0.36); border-left: 1.5px solid rgba(255, 255, 255, 0.36)"></span>
  <span aria-hidden="true" style="position: absolute; bottom: 14px; right: 14px; width: 18px; height: 18px; border-bottom: 1.5px solid rgba(255, 255, 255, 0.36); border-right: 1.5px solid rgba(255, 255, 255, 0.36)"></span>

  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
    <span style="display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px 6px 10px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.14); background: rgba(255, 255, 255, 0.05); font-family: 'Instrument Sans', Arial, sans-serif; font-size: 13px; font-weight: 500; line-height: 1.4; color: rgba(255, 255, 255, 0.82)"><span style="flex: none; width: 7px; height: 7px; border-radius: 50%; background: #8CC2FF"></span>{{kind}} · {{duration}}</span>
    <span style="display: inline-block; padding: 2px 8px; border-radius: 5px; border: 1px dashed rgba(140, 194, 255, 0.5); background: rgba(255, 255, 255, 0.06); font-family: 'Instrument Sans', Arial, sans-serif; font-size: 12px; font-weight: 600; line-height: 1.5; color: #8CC2FF">To film</span>
  </div>

  <div style="display: flex; align-items: flex-end; gap: clamp(16px, 2vw, 24px)">
    <span aria-hidden="true" style="flex: none; width: 60px; height: 60px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 10px rgba(255, 255, 255, 0.07), 0 16px 36px -12px rgba(0, 0, 0, 0.55)"><svg width="20" height="22" viewBox="0 0 20 22" style="margin-left: 4px"><path d="M2 1.8v18.4c0 .8.9 1.3 1.6.9l15-9.2c.6-.4.6-1.3 0-1.7l-15-9.2C2.9.5 2 1 2 1.8z" fill="#101D51"></path></svg></span>
    <div style="min-width: 0">
      <p style="margin: 0; max-width: 32ch; font-family: 'Instrument Sans', Arial, sans-serif; font-size: clamp(19px, 2vw, 27px); font-weight: 560; line-height: 1.16; letter-spacing: -0.02em; color: #FFFFFF; text-wrap: balance">{{heading}}</p>
      <sc-if value="{{hasNote}}" hint-placeholder-val="{{true}}">
        <p style="margin: 8px 0 0; max-width: 56ch; font-size: 15px; line-height: 1.5; color: rgba(255, 255, 255, 0.62); text-wrap: pretty">{{note}}</p>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"heading":{"editor":"text","default":"[Video title]"},"kind":{"editor":"text","default":"Video"},"duration":{"editor":"text","default":"[Length]"},"note":{"editor":"text","default":"[What the video covers]"},"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var heading = p.heading ?? '[Video title]';
    var note = p.note ?? '[What the video covers]';
    return {
      heading: heading,
      kind: p.kind ?? 'Video',
      duration: p.duration ?? '[Length]',
      note: note,
      hasNote: note !== '',
      label: 'Video placeholder: ' + heading
    };
  }
}
</script>
</body>
</html>
